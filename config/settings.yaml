# Configuração geral da coleta.

camara:
  legislatura: 57
  # Início do mandato atual. Sessões e votações antes disso são ignoradas.
  inicio_mandato: "2023-02-01"
  # Anos dos arquivos de votações e presença.
  anos: [2023, 2024, 2025, 2026]
  # Anos dos arquivos de proposições e autores. Inclui anos anteriores para pegar
  # projetos apresentados antes do mandato que viraram lei durante ele.
  anos_proposicoes: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # Tipos de proposição que podem virar norma jurídica e entram no perfil.
  # PLV (projeto de lei de conversão de medida provisória) fica de fora: a Câmara
  # registra como "autor" o relator da MP, não quem propôs. Entra futuramente como relatoria.
  tipos_legislativos: [PL, PLP, PEC, PDL, PRC]

tse:
  # Eleições gerais (pares não múltiplos de 4) e municipais (múltiplos de 4).
  anos: [2014, 2016, 2018, 2020, 2022, 2024, 2026]

site:
  titulo: "Retrospectiva"
  # No GitHub Actions o caminho vem do próprio Pages (variável RETRO_URL_BASE).
  # Localmente, vazio funciona com `python -m http.server`.
  url_base: ""
  repositorio: "https://github.com/matheusepifanio1/Retropolitico"

senado:
  # Legislaturas 56 (2019–2023) e 57 (2023–2027).
  legislaturas: [56, 57]
  # Janela de votações e de exercício contada no perfil.
  inicio: "2019-02-01"
  # Projetos apresentados a partir desta data entram em "viraram lei".
  proposicoes_desde: "2019-02-01"

presidencia:
  # Presidentes eleitos a partir desta eleição (mandatos de 2019 em diante).
  eleicoes_desde: 2018
