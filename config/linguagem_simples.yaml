# Resumos em linguagem simples das propostas votadas (Câmara e Senado).
#
# Gerados automaticamente com IA a partir da EMENTA OFICIAL de cada proposta (exportada pela coleta),
# com regras públicas: só o que a ementa diz, sem adjetivos, sem partidos, sem avaliação.
# Aparecem no site com aviso de texto automático e ao lado do texto oficial.
# Entradas com "revisado" foram escritas e revisadas por pessoas (propostas das votações-chave)
# e aparecem sem o aviso de IA.
#
# Chave: "camara:<id da proposição>" ou "senado:<código da matéria>".
# Para corrigir um resumo, edite a entrada e registre a alteração no histórico do repositório.
# Gerado em 2026-10-12 a partir de 1.474 propostas.

