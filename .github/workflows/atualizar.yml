name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, ~06h17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["retro/**", "config/**", ".github/workflows/atualizar.yml"]

permissions:
  contents: write     # grava o relatório na branch "estado"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  coletar-e-publicar:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: mkdir -p relatorio

      # Reaproveita arquivos brutos de anos fechados entre execuções.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Baixar arquivos oficiais
        run: set -o pipefail; python -u -m retro baixar 2>&1 | tee relatorio/1-baixar.txt

      - name: Inspecionar formato dos arquivos
        if: always()
        run: python -u -m retro inspecionar 2>&1 | tee relatorio/2-inspecao.txt

      - name: Carregar no banco
        run: set -o pipefail; python -u -m retro carregar 2>&1 | tee relatorio/3-carregar.txt

      - name: Listar candidatas a votações-chave
        if: always()
        run: python -u -m retro candidatas > relatorio/5-candidatas.txt 2>&1 || true

      - name: Sondar fontes novas (Senado, TSE)
        if: always()
        timeout-minutes: 10
        run: python -u -m retro sondar > relatorio/6-sonda.txt 2>&1 || true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Gerar o site
        run: set -o pipefail; python -u -m retro site 2>&1 | tee relatorio/4-site.txt
        env:
          RETRO_URL_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

      # Relatório da execução numa branch própria, para acompanhar sem acesso à interface do Actions.
      - name: Publicar relatório na branch "estado"
        if: always()
        run: |
          {
            echo "execucao: ${{ github.run_id }}"
            echo "evento: ${{ github.event_name }}"
            echo "commit: ${{ github.sha }}"
            echo "data_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "resultado_job: ${{ job.status }}"
          } > relatorio/0-resumo.txt
          cp data/raw/manifest.json relatorio/manifest.json 2>/dev/null || true
          cd relatorio
          git init -q -b estado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Relatório da execução ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" estado

  deploy:
    needs: coletar-e-publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
