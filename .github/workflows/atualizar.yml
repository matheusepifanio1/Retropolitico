name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, ~06h17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["retro/**", "config/**", ".github/workflows/atualizar.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  coletar-e-publicar:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # Reaproveita arquivos brutos de anos fechados entre execuções.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Baixar arquivos oficiais
        run: python -m retro baixar

      - name: Carregar no banco
        run: python -m retro carregar

      - name: Gerar o site
        run: python -m retro site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: coletar-e-publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
