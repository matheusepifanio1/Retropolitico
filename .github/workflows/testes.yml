name: Testes

on:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      # Curadoria: garante que o arquivo de votações-chave é YAML válido.
      - run: python -c "import yaml; yaml.safe_load(open('config/votacoes_chave.yaml'))"
